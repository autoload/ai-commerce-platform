server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Deny access to dotfiles (.env, .git, .gitignore, etc.) and any
    # directory Laravel doesn't intend to serve publicly.
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ ^/(storage/framework|storage/logs|bootstrap/cache|vendor|composer\.(json|lock))(/|$) {
        deny all;
        return 404;
    }

    # Laravel front-controller routing: try the requested file, then a
    # directory, then fall through to index.php with the original query string.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    client_max_body_size 20M;
}
